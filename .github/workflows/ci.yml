name: IPI DLBCL CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Python syntax and tests
        env:
          AUDIT_SECRET_KEY: unit-test-only-not-production
        run: |
          python -m compileall -q agents ipi_dlbcl.py cli.py enrichment.py simulator.py
          pytest -q
      - name: Node.js syntax and browser-calculation tests
        run: |
          node --check web/ipi.js
          node --test tests/test_web.cjs
      - name: Basic static security check
        run: |
          if grep -R -En '(eval\\(|document\\.write\\(|innerHTML\\s*=)' web; then
            echo "Potentially unsafe DOM pattern found"; exit 1
          fi
