version: '3.8'

services:
  ipi-dlbcl-prognostic-index:
    build: .
    container_name: ipi-dlbcl-prognostic-index
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=ipi-dlbcl-prognostic-index-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
